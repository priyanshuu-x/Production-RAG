services:
  redis:
    image: redis:latest
    container_name: redis-papermind
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: papermind-api
    command: uv run uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - .env

  frontend:
    build: .
    container_name: papermind-frontend
    command: uv run streamlit run frontend/app.py --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000/query